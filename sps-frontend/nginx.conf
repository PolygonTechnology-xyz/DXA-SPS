server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy to sps-api — disable buffering for SSE/streaming AI responses
    location /api/ {
        proxy_pass http://sps-api-svc:8787/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # AS-IS / TO-BE runs stream for several minutes (default timeout: 60 s)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # document uploads
        client_max_body_size 200m;
    }

    location /dxa/ {
        proxy_pass http://sps-api-svc:8787/dxa/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    location /workspace/ {
        proxy_pass http://sps-api-svc:8787/workspace/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}
